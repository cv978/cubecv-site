        // TikTok Pixel Events
        function trackEvent(event, data) {
            if (typeof ttq !== 'undefined') {
                ttq.track(event, data);
            }
        }
        
        // Track ViewContent event (عند تحميل الصفحة)
        document.addEventListener('DOMContentLoaded', function() {
            trackEvent('ViewContent', {
                content_id: 'time_cv_professional',
                content_type: 'product',
                value: 30,
                currency: 'SAR'
            });
        });
        
        // ✅ حدث Purchase عند الضغط على زر الواتساب
        function trackPurchase() {
            if (typeof ttq !== 'undefined') {
                ttq.track('Purchase', {
                    content_id: 'whatsapp_contact',
                    content_type: 'product',
                    value: 30,
                    currency: 'SAR',
                    phone: '966540427988',
                    contents: [{
                        id: 'cv_pro_service',
                        quantity: 1,
                        price: 30
                    }]
                });
            }
            return true;
        }
        
        // تتبع البقاء في الصفحة 10 ثواني
        setTimeout(function() {
            trackEvent('ViewContent', {
                content_id: 'page_engagement_10s',
                content_type: 'product'
            });
        }, 10000);
        
        // تتبع التمرير لأسفل الصفحة
        let scrollTracked = false;
        window.addEventListener('scroll', function() {
            if (!scrollTracked && (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 100) {
                scrollTracked = true;
                trackEvent('ViewContent', {
                    content_id: 'scroll_to_bottom',
                    content_type: 'product'
                });
            }
        });

<script>
/* TikTok Contact tracking (Pixel + Events API, shared event_id for deduplication).
   Tracking only: no DOM or style changes, never blocks or delays the WhatsApp link. */
(function () {
  if (window.__cubecvContactTracking) return; // guard against double inclusion / duplicate listeners
  window.__cubecvContactTracking = true;

  var ENDPOINT = '/api/tiktok-contact';
  var DEBOUNCE_MS = 1500;
  var lastFire = 0;

  function safeGet(fn) { try { return fn(); } catch (e) { return ''; } }

  // Keep ttclid from the ad landing URL for later clicks in the same browser.
  var ttclid = safeGet(function () { return new URLSearchParams(location.search).get('ttclid') || ''; });
  if (ttclid) { safeGet(function () { localStorage.setItem('cubecv_ttclid', ttclid); }); }
  else { ttclid = safeGet(function () { return localStorage.getItem('cubecv_ttclid') || ''; }); }

  function getCookie(name) {
    return safeGet(function () {
      var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : '';
    });
  }

  function newEventId() {
    var rnd = safeGet(function () { return crypto.randomUUID(); }) ||
      (Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
    return 'contact_' + rnd;
  }

  function isWhatsAppLink(a) {
    var href = (a.getAttribute('href') || '').toLowerCase();
    return href.indexOf('wa.me/') !== -1 || href.indexOf('whatsapp.com/') !== -1 || href.indexOf('whatsapp://') === 0;
  }

  // Anonymous random visitor id (for unique-visitor counts on /admin). Not personal data.
  var visitor = safeGet(function () {
    var v = localStorage.getItem('cubecv_vid');
    if (!v) { v = Math.random().toString(36).slice(2, 12); localStorage.setItem('cubecv_vid', v); }
    return v;
  }) || '';

  function sendServer(payload, endpoint) {
    var url = endpoint || ENDPOINT;
    var body = JSON.stringify(payload);
    try {
      if (navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], { type: 'text/plain' }))) return;
    } catch (e) {}
    try {
      fetch(url, { method: 'POST', body: body, keepalive: true, headers: { 'Content-Type': 'text/plain' } }).catch(function () {});
    } catch (e) {}
  }

  // One visit record per page load, for the /admin dashboard.
  sendServer({ visitor: visitor, referrer: document.referrer || '', ad: !!ttclid && /[?&]ttclid=/.test(location.search) }, '/api/track-view');

  function onClick(ev) {
    try {
      var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
      if (!a || !isWhatsAppLink(a)) return;
      var now = Date.now();
      if (now - lastFire < DEBOUNCE_MS) return; // rapid double-click: one Contact only, link still works
      lastFire = now;

      var eventId = newEventId();
      if (typeof ttq !== 'undefined') {
        ttq.track('Contact', { content_id: 'whatsapp_contact', content_type: 'product' }, { event_id: eventId });
      }
      sendServer({
        event_id: eventId,
        event_time: Math.floor(now / 1000),
        page_url: location.href,
        referrer: document.referrer || '',
        ttclid: ttclid,
        ttp: getCookie('_ttp'),
        visitor: visitor
      });
    } catch (e) { /* tracking must never affect the click */ }
  }

  // One delegated listener covers every WhatsApp link on the page, including ones added later.
  document.addEventListener('click', onClick, true);
})();
